<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>登录 / 注册 · Grasp 销售 AI 陪练</title>
<link rel="stylesheet" href="css/style.css">
<style>
  /* 登录页：PC 渐变背景 + 居中卡片 */
  body.no-tab{background:linear-gradient(160deg,#FFF0EE,#F7F7F8 40%)}
  .auth{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:20px;padding:48px 16px}
  .auth-card{width:480px;max-width:100%;padding:40px 44px}

  /* 品牌区 */
  .auth-logo{display:flex;align-items:center;justify-content:center;gap:10px;
    font-size:28px;font-weight:800;color:var(--coral);letter-spacing:.5px}
  .auth-logo .dot{width:12px;height:12px;border-radius:50%;background:var(--coral);box-shadow:var(--shadow-coral)}
  .auth-hero{text-align:center;margin:18px 0 28px}
  .auth-hero h1{font-size:22px;margin-bottom:6px}
  .auth-hero p{color:var(--text-2);font-size:13.5px}

  /* 验证码行 */
  .code-row{display:flex;gap:10px}
  .code-row .input{flex:1;min-width:0}
  .code-row .btn{flex:none}

  /* 协议勾选 */
  .agree{display:flex;align-items:flex-start;gap:8px;font-size:12.5px;color:var(--text-2);margin:4px 0 20px}
  .agree .box{flex:none;width:16px;height:16px;margin-top:3px;border-radius:4px;
    background:var(--coral);color:#fff;font-size:11px;line-height:16px;text-align:center;box-shadow:var(--shadow-coral)}
  .agree a{color:var(--coral)}

  /* 分隔线：其他方式 */
  .or{display:flex;align-items:center;gap:12px;color:var(--text-2);font-size:12.5px;margin:24px 0 18px}
  .or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}

  /* 第三方圆形按钮 */
  .social{display:flex;justify-content:center;gap:28px;margin-bottom:16px}
  .social a{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--text-2)}
  .sbtn{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    color:#fff;font-size:20px;font-weight:700;transition:.15s}
  .sbtn.wx{background:#07C160}
  .sbtn.apple{background:#1F2329}
  .social a:hover .sbtn{transform:translateY(-2px);box-shadow:var(--shadow-card)}
  .pwd-link{display:block;text-align:center;font-size:13.5px;color:var(--text-2);font-weight:500}
  .pwd-link:hover{color:var(--coral)}

  /* 演示区块：首次登录选场景 */
  .demo-tag{display:flex;justify-content:center;margin-bottom:14px}
  .demo-card h2{text-align:center;font-size:18px;margin-bottom:4px}
  .demo-card .sub{text-align:center;font-size:13px;color:var(--text-2);margin-bottom:18px}
  .pick-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:22px}
  .pick{position:relative;border:1.5px solid var(--line);border-radius:14px;padding:16px 14px;
    background:#fff;cursor:pointer;transition:.15s}
  .pick:hover{border-color:#FFD9D2}
  .pick .em{font-size:26px;line-height:1.2}
  .pick h3{margin:8px 0 3px}
  .pick p{font-size:12px;color:var(--text-2);line-height:1.5}
  .pick.on{border-color:var(--coral);background:var(--coral-soft)}
  .pick .ck{position:absolute;top:10px;right:10px;width:18px;height:18px;border-radius:50%;
    border:1.5px solid var(--line);background:#fff}
  .pick.on .ck{border-color:var(--coral);background:var(--coral);color:#fff;
    font-size:11px;line-height:15px;text-align:center}

  @media (max-width:768px){
    body.no-tab{background:#fff}
    .auth{padding:0;gap:0;justify-content:flex-start}
    .auth-card{width:100%;box-shadow:none;border-radius:0;padding:40px 22px 32px}
    .auth-card + .auth-card{border-top:8px solid var(--bg);padding-top:28px}
  }
</style>
</head>
<body class="no-tab">

<main class="auth">

  <!-- 登录 / 注册卡片 -->
  <section class="card auth-card">
    <div class="auth-logo"><span class="dot"></span>Grasp</div>
    <div class="auth-hero">
      <h1>像实战一样练销售</h1>
      <p>AI 扮演客户，随时陪你过招</p>
    </div>

    <div class="field">
      <input class="input" type="tel" placeholder="请输入手机号">
    </div>
    <div class="field">
      <div class="code-row">
        <input class="input" type="text" placeholder="请输入验证码">
        <button class="btn ghost sm">获取验证码</button>
      </div>
    </div>
    <div class="agree">
      <span class="box">✓</span>
      <span>我已阅读并同意<a href="#">《用户协议》</a>和<a href="#">《隐私政策》</a></span>
    </div>
    <a class="btn primary block" href="index.html">登录 / 注册</a>

    <div class="or">其他方式</div>
    <div class="social">
      <a href="#"><span class="sbtn wx">微</span>微信</a>
      <a href="#"><span class="sbtn apple"></span>Apple</a>
    </div>
    <a class="pwd-link" href="#">密码登录 ›</a>
  </section>

  <!-- 演示区块：首次登录 - 选择常练场景 -->
  <section class="card auth-card demo-card">
    <div class="demo-tag"><span class="chip gray">状态演示：首次登录 · 选择常练场景</span></div>
    <h2>你最常练哪类场景？</h2>
    <p class="sub">可多选，帮你更快找到合适的对手</p>
    <div class="pick-grid">
      <div class="pick on">
        <span class="ck">✓</span>
        <div class="em">📞</div>
        <h3>电话销售</h3>
        <p>主动外呼、绕过前台、开场破冰</p>
      </div>
      <div class="pick">
        <span class="ck"></span>
        <div class="em">💬</div>
        <h3>客户主动咨询</h3>
        <p>接住上门线索，快速摸清需求</p>
      </div>
      <div class="pick on">
        <span class="ck">✓</span>
        <div class="em">🤝</div>
        <h3>成交谈判</h3>
        <p>价格博弈、条款拉扯、临门一脚</p>
      </div>
      <div class="pick">
        <span class="ck"></span>
        <div class="em">🚶</div>
        <h3>地推破冰</h3>
        <p>陌生场景下 30 秒打开话题</p>
      </div>
    </div>
    <a class="btn primary block" href="index.html">完成，开始探索</a>
  </section>

</main>

</body>
</html>
