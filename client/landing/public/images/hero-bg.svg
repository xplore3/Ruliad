  </defs>

  <rect width="1440" height="900" fill="url(#hDots)"/>
  <rect width="1440" height="900" fill="url(#hGlowA)"/>
  <rect width="1440" height="900" fill="url(#hGlowB)"/>

  <!-- 神经网络连线 -->
