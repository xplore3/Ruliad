<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" fill="none">
  <defs>
    <radialGradient id="hGlowA" cx="0.72" cy="0.28" r="0.55">
      <stop offset="0" stop-color="#E85C62" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#E85C62" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hGlowB" cx="0.16" cy="0.74" r="0.5">
      <stop offset="0" stop-color="#34D399" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#34D399" stop-opacity="0"/>
    </radialGradient>
    <pattern id="hDots" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.1" fill="#33405E" fill-opacity="0.55"/>
    </pattern>
    <linearGradient id="hFlow" x1="0" y1="0" x2="1" y2="0">
