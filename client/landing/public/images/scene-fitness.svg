<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" fill="none">
  <!-- 背景 -->
  <rect width="400" height="280" rx="16" fill="#141B2D"/>
  
  <!-- 跑步机轮廓 -->
  <rect x="40" y="180" width="160" height="6" rx="3" fill="#2E3A56"/>
  <rect x="55" y="100" width="130" height="80" rx="8" fill="#1A2236" stroke="#2E3A56" stroke-width="2"/>
  <rect x="62" y="108" width="116" height="55" rx="4" fill="#0F1420"/>
  
  <!-- 跑步机显示屏 -->
  <rect x="75" y="115" width="50" height="30" rx="4" fill="#141B2D" stroke="#2E3A56" stroke-width="1"/>
  <text x="100" y="134" text-anchor="middle" fill="#34D399" font-size="12" font-weight="bold" font-family="sans-serif">12.5</text>
  <text x="100" y="141" text-anchor="middle" fill="#6B7384" font-size="5" font-family="sans-serif">km/h</text>
  
  <!-- 扶手 -->
  <rect x="55" y="85" width="8" height="25" rx="4" fill="#2E3A56"/>
  <rect x="177" y="85" width="8" height="25" rx="4" fill="#2E3A56"/>
  <rect x="50" y="82" width="145" height="6" rx="3" fill="#2E3A56"/>
  
  <!-- 哑铃 -->
  <rect x="270" y="155" width="60" height="8" rx="4" fill="#9BA3B5"/>
  <rect x="260" y="147" width="16" height="24" rx="4" fill="#E85C62"/>
  <rect x="324" y="147" width="16" height="24" rx="4" fill="#E85C62"/>
  
  <!-- 杠铃 -->
  <rect x="250" y="100" width="100" height="6" rx="3" fill="#6B7384"/>
  <rect x="242" y="90" width="14" height="26" rx="4" fill="#E85C62"/>
  <rect x="344" y="90" width="14" height="26" rx="4" fill="#E85C62"/>
  
  <!-- 心率图标 -->
  <path d="M120 45 C110 35 95 40 95 50 C95 65 120 80 120 80 C120 80 145 65 145 50 C145 40 130 35 120 45Z" fill="#E85C62" opacity="0.8"/>
  
  <!-- 数据标签 -->
  <rect x="50" y="210" width="45" height="20" rx="6" fill="#1A2236"/>
  <text x="72" y="224" text-anchor="middle" fill="#34D399" font-size="9" font-family="sans-serif">心率</text>
  <rect x="100" y="210" width="45" height="20" rx="6" fill="#1A2236"/>
  <text x="122" y="224" text-anchor="middle" fill="#E85C62" font-size="9" font-family="sans-serif">卡路里</text>
  <rect x="150" y="210" width="45" height="20" rx="6" fill="#1A2236"/>
  <text x="172" y="224" text-anchor="middle" fill="#9BA3B5" font-size="9" font-family="sans-serif">时长</text>
  
  <!-- 装饰线条 -->
  <line x1="280" y1="200" x2="370" y2="200" stroke="#2E3A56" stroke-width="1.5" stroke-dasharray="4 4"/>
  <circle cx="280" cy="200" r="3" fill="#34D399"/>
  <circle cx="325" cy="200" r="3" fill="#E85C62"/>
  <circle cx="370" cy="200" r="3" fill="#9BA3B5"/>
  
  <!-- 进度条 -->
  <rect x="260" y="230" width="110" height="4" rx="2" fill="#2E3A56"/>
  <rect x="260" y="230" width="72" height="4" rx="2" fill="#34D399"/>
</svg>
