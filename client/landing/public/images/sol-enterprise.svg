<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" fill="none">
  <defs>
    <linearGradient id="entSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1A2236"/>
      <stop offset="1" stop-color="#141B2D"/>
    </linearGradient>
    <radialGradient id="entGlow" cx="0.85" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#E85C62" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#E85C62" stop-opacity="0"/>
    </radialGradient>
    <pattern id="winE" width="16" height="22" patternUnits="userSpaceOnUse">
      <rect x="4" y="6" width="7" height="9" fill="#E85C62" fill-opacity="0.28"/>
    </pattern>
  </defs>

  <rect width="640" height="360" fill="url(#entSky)"/>
  <rect width="640" height="360" fill="url(#entGlow)"/>

  <!-- 楼群 -->
  <g stroke="#2E3A56" stroke-width="1">
    <rect x="70" y="150" width="72" height="150" fill="#1A2236"/>
    <rect x="158" y="100" width="96" height="200" fill="#1D2539"/>
    <rect x="270" y="180" width="64" height="120" fill="#1A2236"/>
    <rect x="350" y="130" width="84" height="170" fill="#1A2236"/>
    <rect x="450" y="90" width="100" height="210" fill="#1D2539"/>
  </g>
  <!-- 窗户阵列 -->
  <g>
    <rect x="70" y="150" width="72" height="150" fill="url(#winE)"/>
    <rect x="158" y="100" width="96" height="200" fill="url(#winE)"/>
    <rect x="270" y="180" width="64" height="120" fill="url(#winE)"/>
    <rect x="350" y="130" width="84" height="170" fill="url(#winE)"/>
    <rect x="450" y="90" width="100" height="210" fill="url(#winE)"/>
  </g>
  <!-- 亮窗 -->
  <g fill="#E85C62">
    <rect x="162" y="128" width="7" height="9" fill-opacity="0.95"/>
    <rect x="354" y="174" width="7" height="9" fill-opacity="0.95"/>
    <rect x="482" y="134" width="7" height="9" fill-opacity="0.95"/>
    <rect x="230" y="194" width="7" height="9" fill-opacity="0.9"/>
    <rect x="542" y="166" width="7" height="9" fill-opacity="0.9"/>
    <rect x="102" y="194" width="7" height="9" fill-opacity="0.8"/>
  </g>

  <!-- 楼顶天线 -->
  <path d="M500 90 V 58" stroke="#3A4666" stroke-width="2"/>
  <circle cx="500" cy="56" r="3" fill="#E85C62"/>
  <path d="M206 100 V 78" stroke="#3A4666" stroke-width="1.5"/>
  <circle cx="206" cy="76" r="2.5" fill="#E85C62" fill-opacity="0.8"/>

  <!-- 地平线 -->
  <path d="M0 300 H 640" stroke="#2E3A56" stroke-width="1.5"/>

  <!-- 前景：业绩上升曲线 -->
  <path d="M60 322 L 180 262 L 300 286 L 430 202 L 556 132" stroke="#E85C62" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <circle cx="556" cy="132" r="6" fill="#E85C62"/>
  <circle cx="556" cy="132" r="13" stroke="#E85C62" stroke-opacity="0.4" fill="none"/>
  <g fill="#E85C62">
    <circle cx="180" cy="262" r="3.5"/>
    <circle cx="300" cy="286" r="3.5"/>
    <circle cx="430" cy="202" r="3.5"/>
  </g>
</svg>
