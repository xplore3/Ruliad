  <line x1="220" y1="120" x2="195" y2="90" stroke="#9BA3B5" stroke-width="3" stroke-linecap="round"/>
  <circle cx="193" cy="87" r="3" fill="#E85C62"/>
  
  <!-- 座椅 -->
  <rect x="220" y="210" width="60" height="8" rx="4" fill="#2E3A56"/>
  <rect x="230" y="218" width="4" height="30" rx="2" fill="#2E3A56"/>
