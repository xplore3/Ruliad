  <path d="M100 70 L120 60 L140 75 L125 85" stroke="#E85C62" stroke-width="1.5" fill="none" opacity="0.5"/>
  
  <!-- 调色板 -->
  <ellipse cx="260" cy="160" rx="45" ry="35" fill="#1A2236" stroke="#2E3A56" stroke-width="2"/>
  <circle cx="245" cy="148" r="6" fill="#E85C62"/>
  <circle cx="265" cy="142" r="5" fill="#34D399"/>
  <circle cx="278" cy="152" r="5" fill="#F07380"/>
  <circle cx="252" cy="170" r="5" fill="#9BA3B5"/>
  <circle cx="272" cy="168" r="4" fill="#6B7384"/>
  
