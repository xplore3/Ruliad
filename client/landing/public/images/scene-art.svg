<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" fill="none">
  <!-- 背景 -->
  <rect width="400" height="280" rx="16" fill="#141B2D"/>
  
  <!-- 画架 -->
  <rect x="60" y="40" width="4" height="180" rx="2" fill="#2E3A56"/>
  <rect x="60" y="200" width="120" height="4" rx="2" fill="#2E3A56"/>
  <polygon points="180,40 60,40 120,180" fill="#1A2236" stroke="#2E3A56" stroke-width="2"/>
  
  <!-- 画布 -->
  <rect x="72" y="55" width="92" height="70" rx="3" fill="#F2F4F8"/>
  
  <!-- 画作内容 - 抽象艺术 -->
  <circle cx="105" cy="78" r="10" fill="#E85C62" opacity="0.8"/>
